<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake - GameZone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-bottom: 2px solid #ff0055;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #ff0055;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back {
            padding: 10px 20px;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .game-container {
            margin-top: 100px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            color: #2ecc71;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .score-board {
            font-size: 24px;
            margin-bottom: 20px;
            color: #fff;
        }

        #gameCanvas {
            border: 4px solid #2ecc71;
            border-radius: 10px;
            background: #1a1a2e;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn-control {
            width: 60px;
            height: 60px;
            background: #2ecc71;
            border: none;
            border-radius: 10px;
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-control:hover {
            background: #27ae60;
            transform: scale(1.1);
        }

        .instructions {
            margin-top: 30px;
            color: #999;
            font-size: 14px;
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 20px;
            border: 3px solid #ff0055;
            text-align: center;
            display: none;
        }

        .game-over h2 {
            font-size: 36px;
            color: #ff0055;
            margin-bottom: 20px;
        }

        .btn-restart {
            padding: 15px 40px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="fas fa-gamepad"></i>
            GameZone
        </div>
        <a href="index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i>
            Баргаштан
        </a>
    </header>

    <div class="game-container">
        <h1>🐍 Snake</h1>
        <div class="score-board">
            Хол: <span id="score">0</span>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div class="controls">
            <button class="btn-control" onclick="changeDirection('up')">⬆️</button>
        </div>
        <div class="controls">
            <button class="btn-control" onclick="changeDirection('left')">⬅️</button>
            <button class="btn-control" onclick="changeDirection('down')">⬇️</button>
            <button class="btn-control" onclick="changeDirection('right')">➡️</button>
        </div>

        <p class="instructions">
            Тугмаҳои стрелка ё тугмаҳои болоиро истифода баред
        </p>
    </div>

    <div class="game-over" id="gameOver">
        <h2>Бозӣ тамом шуд!</h2>
        <p>Холи шумо: <span id="finalScore">0</span></p>
        <button class="btn-restart" onclick="restartGame()">
            <i class="fas fa-redo"></i>
            Аз нав сар кардан
        </button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverDiv = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameRunning = false;

        function drawGame() {
            clearCanvas();
            moveSnake();
            checkCollision();
            drawFood();
            drawSnake();
            
            if (gameRunning) {
                setTimeout(drawGame, 100);
            }
        }

        function clearCanvas() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#2ecc71' : '#27ae60';
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function drawFood() {
            ctx.fillStyle = '#ff0055';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function moveSnake() {
            if (!gameRunning) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                placeFood();
            } else {
                snake.pop();
            }
        }

        function checkCollision() {
            const head = snake[0];

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }

            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }
        }

        function placeFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
        }

        function endGame() {
            gameRunning = false;
            finalScoreElement.textContent = score;
            gameOverDiv.style.display = 'block';
        }

        function restartGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.textContent = 0;
            gameOverDiv.style.display = 'none';
            placeFood();
            gameRunning = true;
            drawGame();
        }

        function changeDirection(direction) {
            if (!gameRunning && (dx === 0 && dy === 0)) {
                gameRunning = true;
                drawGame();
            }

            switch(direction) {
                case 'up':
                    if (dy === 0) { dx = 0; dy = -1; }
                    break;
                case 'down':
                    if (dy === 0) { dx = 0; dy = 1; }
                    break;
                case 'left':
                    if (dx === 0) { dx = -1; dy = 0; }
                    break;
                case 'right':
                    if (dx === 0) { dx = 1; dy = 0; }
                    break;
            }
        }

        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp': changeDirection('up'); break;
                case 'ArrowDown': changeDirection('down'); break;
                case 'ArrowLeft': changeDirection('left'); break;
                case 'ArrowRight': changeDirection('right'); break;
            }
        });

        placeFood();
        clearCanvas();
        drawSnake();
        drawFood();
    </script>
</body>
</html>

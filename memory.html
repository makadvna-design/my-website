<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game - GameZone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-bottom: 2px solid #ff0055;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #ff0055;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back {
            padding: 10px 20px;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .game-container {
            margin-top: 100px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            color: #9b59b6;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .stats {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-bottom: 30px;
            font-size: 20px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            gap: 15px;
            margin: 0 auto;
        }

        .card {
            width: 80px;
            height: 80px;
            background: #9b59b6;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            transition: 0.3s;
            transform-style: preserve-3d;
        }

        .card.flipped {
            background: #8e44ad;
            transform: rotateY(180deg);
        }

        .card.matched {
            background: #2ecc71;
            cursor: default;
        }

        .btn-restart {
            margin-top: 30px;
            padding: 15px 40px;
            background: #9b59b6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="fas fa-gamepad"></i>
            GameZone
        </div>
        <a href="index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i>
            Баргаштан
        </a>
    </header>

    <div class="game-container">
        <h1>🧠 Memory Game</h1>
        <div class="stats">
            <div>Ҳаракат: <span id="moves">0</span></div>
            <div>Ҷуфт: <span id="pairs">0</span>/8</div>
        </div>
        <div class="board" id="board"></div>
        <button class="btn-restart" onclick="initGame()">
            <i class="fas fa-redo"></i>
            Аз нав
        </button>
    </div>

    <script>
        const board = document.getElementById('board');
        const movesElement = document.getElementById('moves');
        const pairsElement = document.getElementById('pairs');

        const emojis = ['🎮', '🎲', '🎯', '🎪', '🎨', '🎭', '🎪', '🎸'];
        let cards = [...emojis, ...emojis];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canFlip = true;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            board.innerHTML = '';
            cards = shuffle([...cards]);
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            canFlip = true;
            movesElement.textContent = moves;
            pairsElement.textContent = matchedPairs;

            cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = index;
                card.dataset.emoji = emoji;
                card.textContent = '?';
                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard(e) {
            const card = e.target;
            
            if (!canFlip || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            card.textContent = card.dataset.emoji;
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                movesElement.textContent = moves;
                canFlip = false;

                if (flippedCards[0].dataset.emoji === flippedCards[1].dataset.emoji) {
                    flippedCards[0].classList.add('matched');
                    flippedCards[1].classList.add('matched');
                    matchedPairs++;
                    pairsElement.textContent = matchedPairs;
                    flippedCards = [];
                    canFlip = true;

                    if (matchedPairs === 8) {
                        setTimeout(() => alert(`Табрик! Шумо дар ${moves} ҳаракат ғолиб шудед! 🎉`), 500);
                    }
                } else {
                    setTimeout(() => {
                        flippedCards[0].classList.remove('flipped');
                        flippedCards[0].textContent = '?';
                        flippedCards[1].classList.remove('flipped');
                        flippedCards[1].textContent = '?';
                        flippedCards = [];
                        canFlip = true;
                    }, 1000);
                }
            }
        }

        initGame();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tg" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ЁРӢ — Платформаи Кӯмаки Оммавӣ</title>
  
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  
  <style>
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .active-tab { color: #10b981 !important; border-top: 2px solid #10b981; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-full pb-28 selection:bg-emerald-500">

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-40 glass bg-slate-900/90 border-b border-slate-800">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg">
          <i class="fa-solid fa-hand-holding-heart"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-base leading-none text-white">ЁРӢ.ТҶ</h1>
          <p class="text-[10px] text-emerald-400 font-medium mt-0.5"><i class="fa-solid fa-circle text-[6px] animate-pulse mr-1"></i>Шабакаи Кӯмаки Зинда</p>
        </div>
      </div>
      
      <div id="authStatusBtn">
        <button onclick="openModal('authModal')" class="bg-slate-800 text-emerald-400 border border-emerald-500/30 text-xs font-bold px-3 py-2 rounded-xl">
          <i class="fa-solid fa-user-plus mr-1"></i> Сабти ном
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="max-w-md mx-auto px-4 pt-4">
    
    <!-- BANNER -->
    <div class="glass rounded-3xl p-4 bg-gradient-to-br from-slate-900 to-emerald-950/40 border border-emerald-500/20 mb-4">
      <h2 class="text-base font-bold text-white">Ба якдигар даст дароз кунем!</h2>
      <p class="text-xs text-slate-400 mt-1">Ҳамаи эълонҳо дар реҷаи реалӣ (онлайн) ба тамоми корбарон нишон дода мешаванд.</p>
    </div>

    <!-- FEED CONTAINER -->
    <div id="postsFeed" class="space-y-3">
      <div class="text-center py-10 text-slate-500 text-xs">
        <i class="fa-solid fa-spinner animate-spin text-2xl text-emerald-500 mb-2"></i>
        <p>Эълонҳо аз сервер боргирӣ шуда истодаанд...</p>
      </div>
    </div>

  </main>

  <!-- FLOATING ADD BUTTON -->
  <button onclick="checkAuthAndAdd()" class="fixed bottom-20 right-4 z-40 bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-bold p-4 rounded-full shadow-2xl flex items-center justify-center active:scale-95 transition">
    <i class="fa-solid fa-plus text-xl"></i>
  </button>

  <!-- MODAL: AUTHENTICATION -->
  <div id="authModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="glass bg-slate-900 w-full max-w-sm rounded-3xl p-5 border border-slate-800 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-sm text-white">Сабти ном / Воридшавӣ</h3>
        <button onclick="closeModal('authModal')" class="text-slate-400 text-lg">&times;</button>
      </div>
      <form onsubmit="handleAuth(event)" class="space-y-3 text-xs">
        <input type="text" id="regName" placeholder="Ном ва Насаб" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200">
        <input type="email" id="regEmail" placeholder="E-mail" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200">
        <input type="password" id="regPass" placeholder="Парол" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200">
        <button type="submit" class="w-full bg-emerald-500 text-slate-950 font-bold py-3 rounded-xl">Даромад / Сабти ном</button>
      </form>
    </div>
  </div>

  <!-- MODAL: ADD POST -->
  <div id="postModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="glass bg-slate-900 w-full max-w-sm rounded-3xl p-5 border border-slate-800 space-y-3 text-xs">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 class="font-bold text-white">Эълони Нав</h3>
        <button onclick="closeModal('postModal')" class="text-slate-400 text-lg">&times;</button>
      </div>
      <form onsubmit="publishPost(event)" class="space-y-3">
        <select id="pType" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200">
          <option value="item">🎁 Чиз / Маҳсулоти ройгон</option>
          <option value="master">🛠️ Усто / Кӯмаки ройгони техникӣ</option>
          <option value="urgent">🚨 Дархости Оҷил</option>
        </select>
        <input type="text" id="pTitle" placeholder="Сарлавҳа" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200">
        <textarea id="pDesc" rows="3" placeholder="Шарҳи пурра..." required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200"></textarea>
        <input type="text" id="pCity" placeholder="Шаҳр / Ноҳия" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200">
        <input type="tel" id="pPhone" placeholder="Телефон (+992)" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200">
        <button type="submit" class="w-full bg-emerald-500 text-slate-950 font-bold py-3 rounded-xl">Нашр кардан ба ҳама</button>
      </form>
    </div>
  </div>

  <script>
    // 1. ИНҶО CONFIG-И FIREBASE-И ХУДРО МЕГУЗОРЕД (аз console.firebase.google.com):
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "yori-tj.firebaseapp.com",
      projectId: "yori-tj",
      storageBucket: "yori-tj.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;

    // Track User Auth State
    auth.onAuthStateChanged(user => {
      currentUser = user;
      const statusBtn = document.getElementById('authStatusBtn');
      if (user) {
        statusBtn.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-xs text-emerald-400 font-bold">${user.displayName || 'Корбар'}</span>
            <button onclick="auth.signOut()" class="text-[10px] bg-slate-800 text-slate-400 px-2 py-1 rounded-lg">Баромад</button>
          </div>
        `;
      } else {
        statusBtn.innerHTML = `
          <button onclick="openModal('authModal')" class="bg-slate-800 text-emerald-400 border border-emerald-500/30 text-xs font-bold px-3 py-2 rounded-xl">
            <i class="fa-solid fa-user-plus mr-1"></i> Сабти ном
          </button>
        `;
      }
    });

    // Handle Authentication (Login/Register)
    function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('regEmail').value;
      const pass = document.getElementById('regPass').value;
      const name = document.getElementById('regName').value;

      auth.createUserWithEmailAndPassword(email, pass)
        .then(res => {
          return res.user.updateProfile({ displayName: name });
        })
        .then(() => {
          closeModal('authModal');
          alert('Шумо бо муваффақият сабти ном шудед!');
        })
        .catch(err => {
          // If user exists, try login
          auth.signInWithEmailAndPassword(email, pass)
            .then(() => closeModal('authModal'))
            .catch(error => alert("Хатогӣ: " + error.message));
        });
    }

    // Load Posts Real-Time from Cloud
    db.collection("posts").orderBy("createdAt", "desc").onSnapshot(snapshot => {
      const feed = document.getElementById('postsFeed');
      if (snapshot.empty) {
        feed.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">Ҳоло ҳеҷ эълоне нест. Аввалин шуда эълон гузоред!</div>`;
        return;
      }

      feed.innerHTML = snapshot.docs.map(doc => {
        const item = doc.data();
        return `
          <div class="glass rounded-2xl p-4 space-y-2 border border-slate-800">
            <div class="flex justify-between items-center text-[10px]">
              <span class="text-emerald-400 font-bold bg-emerald-500/10 px-2 py-0.5 rounded">${item.type.toUpperCase()}</span>
              <span class="text-slate-500">${item.city}</span>
            </div>
            <h3 class="font-bold text-xs text-white">${item.title}</h3>
            <p class="text-[11px] text-slate-300">${item.desc}</p>
            <div class="text-[10px] text-slate-500 pt-1 border-t border-slate-800 flex justify-between items-center">
              <span>Муаллиф: ${item.authorName || 'Аноним'}</span>
              <a href="tel:${item.phone}" class="bg-emerald-500 text-slate-950 px-3 py-1 rounded-lg font-bold">Занг занед</a>
            </div>
          </div>
        `;
      }).join('');
    });

    function checkAuthAndAdd() {
      if (!currentUser) {
        alert('Барои гузоштани эълон аввал сабти ном кунед!');
        openModal('authModal');
      } else {
        openModal('postModal');
      }
    }

    function publishPost(e) {
      e.preventDefault();
      db.collection("posts").add({
        type: document.getElementById('pType').value,
        title: document.getElementById('pTitle').value,
        desc: document.getElementById('pDesc').value,
        city: document.getElementById('pCity').value,
        phone: document.getElementById('pPhone').value,
        authorId: currentUser.uid,
        authorName: currentUser.displayName || 'Корбар',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        closeModal('postModal');
        e.target.reset();
      });
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooter - GameZone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-bottom: 2px solid #ff0055;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #ff0055;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back {
            padding: 10px 20px;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .game-container {
            margin-top: 100px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            color: #1abc9c;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .stats {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-bottom: 30px;
            font-size: 20px;
        }

        #gameCanvas {
            border: 4px solid #1abc9c;
            border-radius: 10px;
            background: #1a1a2e;
        }

        .btn-start {
            margin-top: 30px;
            padding: 15px 40px;
            background: #1abc9c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="fas fa-gamepad"></i>
            GameZone
        </div>
        <a href="index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i>
            Баргаштан
        </a>
    </header>

    <div class="game-container">
        <h1>🎯 Shooter</h1>
        <div class="stats">
            <div>Хол: <span id="score">0</span></div>
            <div>Тир: <span id="bullets">10</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        
        <button class="btn-start" onclick="startGame()">
            <i class="fas fa-play"></i>
            Оғоз
        </button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const bulletsElement = document.getElementById('bullets');

        let playerX = 200;
        let bullets = [];
        let targets = [];
        let score = 0;
        let bulletsLeft = 10;
        let gameRunning = false;

        function drawGame() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#1abc9c';
            ctx.fillRect(playerX - 25, 450, 50, 50);

            bullets.forEach(bullet => {
                ctx.fillStyle = '#f39c12';
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });

            targets.forEach((target, index) => {
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(target.x, target.y, 40, 40);
            });

            if (gameRunning) {
                updateGame();
                requestAnimationFrame(drawGame);
            }
        }

        function updateGame() {
            bullets.forEach((bullet, bIndex) => {
                bullet.y -= 10;

                if (bullet.y < 0) {
                    bullets.splice(bIndex, 1);
                }

                targets.forEach((target, tIndex) => {
                    if (
                        bullet.x > target.x &&
                        bullet.x < target.x + 40 &&
                        bullet.y > target.y &&
                        bullet.y < target.y + 40
                    ) {
                        score += 10;
                        scoreElement.textContent = score;
                        targets.splice(tIndex, 1);
                        bullets.splice(bIndex, 1);
                    }
                });
            });

            if (Math.random() < 0.03) {
                targets.push({x: Math.random() * 360, y: -40});
            }

            targets.forEach((target, index) => {
                target.y += 2;

                if (target.y > canvas.height) {
                    targets.splice(index, 1);
                }
            });

            if (bulletsLeft === 0 && bullets.length === 0) {
                gameOver();
            }
        }

        function shoot() {
            if (!gameRunning || bulletsLeft <= 0) return;
            
            bullets.push({x: playerX, y: 450});
            bulletsLeft--;
            bulletsElement.textContent = bulletsLeft;
        }

        function startGame() {
            playerX = 200;
            bullets = [];
            targets = [];
            score = 0;
            bulletsLeft = 10;
            gameRunning = true;
            scoreElement.textContent = score;
            bulletsElement.textContent = bulletsLeft;
            drawGame();
        }

        function gameOver() {
            gameRunning = false;
            alert(`Бозӣ тамом шуд! Холи шумо: ${score}`);
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            playerX = e.clientX - rect.left;
            shoot();
        });

        drawGame();
    </script>
</body>
</html>

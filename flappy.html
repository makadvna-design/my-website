<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - GameZone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-bottom: 2px solid #ff0055;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #ff0055;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-back {
            padding: 10px 20px;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .game-container {
            margin-top: 100px;
            text-align: center;
        }
        h1 {
            font-size: 48px;
            color: #4caf50;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .stats {
            font-size: 24px;
            margin-bottom: 30px;
        }
        #gameCanvas {
            border: 4px solid #4caf50;
            border-radius: 10px;
            background: #87CEEB;
        }
        .btn-start {
            margin-top: 30px;
            padding: 15px 40px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="fas fa-gamepad"></i>
            GameZone
        </div>
        <a href="index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i>
            Баргаштан
        </a>
    </header>

    <div class="game-container">
        <h1>🐦 Flappy Bird</h1>
        <div class="stats">
            Хол: <span id="score">0</span>
        </div>
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        <button class="btn-start" onclick="startGame()">
            <i class="fas fa-play"></i>
            Оғоз
        </button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        let bird = {x: 50, y: 250, velocity: 0, gravity: 0.5, jump: -8};
        let pipes = [];
        let score = 0;
        let gameRunning = false;
        let frame = 0;

        function draw() {
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#4caf50';
            ctx.fillRect(bird.x, bird.y, 30, 30);

            pipes.forEach(pipe => {
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(pipe.x, 0, 50, pipe.top);
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, 50, pipe.bottom);
            });

            ctx.fillStyle = '#fff';
            ctx.font = '30px Arial';
            ctx.fillText(score, 20, 40);
        }

        function update() {
            if (!gameRunning) return;

            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            if (frame % 100 === 0) {
                const gap = 150;
                const topHeight = Math.random() * (canvas.height - gap - 100) + 50;
                pipes.push({x: canvas.width, top: topHeight, bottom: canvas.height - gap - topHeight});
            }

            pipes.forEach((pipe, index) => {
                pipe.x -= 3;

                if (bird.x + 30 > pipe.x && bird.x < pipe.x + 50 &&
                    (bird.y < pipe.top || bird.y + 30 > canvas.height - pipe.bottom)) {
                    gameRunning = false;
                    alert(`Бозӣ тамом! Хол: ${score}`);
                }

                if (pipe.x + 50 < 0) {
                    pipes.splice(index, 1);
                    score++;
                    scoreElement.textContent = score;
                }
            });

            if (bird.y + 30 > canvas.height || bird.y < 0) {
                gameRunning = false;
                alert(`Бозӣ тамом! Хол: ${score}`);
            }

            frame++;
            draw();
            requestAnimationFrame(update);
        }

        canvas.addEventListener('click', () => {
            if (gameRunning) bird.velocity = bird.jump;
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && gameRunning) bird.velocity = bird.jump;
        });

        function startGame() {
            if (gameRunning) return;
            bird.y = 250;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            frame = 0;
            scoreElement.textContent = 0;
            gameRunning = true;
            update();
        }

        draw();
    </script>
</body>
</html>

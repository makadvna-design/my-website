<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout - GameZone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-bottom: 2px solid #ff0055;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #ff0055;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-back {
            padding: 10px 20px;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .game-container {
            margin-top: 100px;
            text-align: center;
        }
        h1 {
            font-size: 48px;
            color: #ff5722;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .stats {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-bottom: 30px;
            font-size: 20px;
        }
        #gameCanvas {
            border: 4px solid #ff5722;
            border-radius: 10px;
            background: #1a1a2e;
        }
        .btn-start {
            margin-top: 30px;
            padding: 15px 40px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="fas fa-gamepad"></i>
            GameZone
        </div>
        <a href="index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i>
            Баргаштан
        </a>
    </header>

    <div class="game-container">
        <h1>🏓 Breakout</h1>
        <div class="stats">
            <div>Хол: <span id="score">0</span></div>
            <div>Ҷон: <span id="lives">3</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        <button class="btn-start" onclick="startGame()">
            <i class="fas fa-play"></i>
            Оғоз
        </button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');

        let paddle = {x: 150, width: 100, height: 10};
        let ball = {x: 200, y: 300, dx: 4, dy: -4, radius: 8};
        let bricks = [];
        let score = 0;
        let lives = 3;
        let gameRunning = false;

        const brickRowCount = 5;
        const brickColumnCount = 8;
        const brickWidth = 45;
        const brickHeight = 20;
        const brickPadding = 5;
        const brickOffsetTop = 30;
        const brickOffsetLeft = 5;

        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    bricks[c][r] = {x: 0, y: 0, status: 1};
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff5722';
            ctx.fillRect(paddle.x, canvas.height - paddle.height - 10, paddle.width, paddle.height);

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            const colors = ['#ff0055', '#e91e63', '#9c27b0', '#3f51b5', '#2196f3'];
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        const brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                        const brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        ctx.fillStyle = colors[r];
                        ctx.fillRect(brickX, brickY, brickWidth, brickHeight);
                    }
                }
            }
        }

        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        if (ball.x > b.x && ball.x < b.x + brickWidth && ball.y > b.y && ball.y < b.y + brickHeight) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 10;
                            scoreElement.textContent = score;
                            if (score === brickRowCount * brickColumnCount * 10) {
                                gameRunning = false;
                                alert('Ғолиб!');
                            }
                        }
                    }
                }
            }
        }

        function move() {
            if (!gameRunning) return;

            if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
                ball.dx = -ball.dx;
            }
            if (ball.y + ball.dy < ball.radius) {
                ball.dy = -ball.dy;
            } else if (ball.y + ball.dy > canvas.height - ball.radius - 20) {
                if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                    ball.dy = -ball.dy;
                } else {
                    lives--;
                    livesElement.textContent = lives;
                    if (!lives) {
                        gameRunning = false;
                        alert(`Бозӣ тамом! Хол: ${score}`);
                    } else {
                        ball.x = canvas.width / 2;
                        ball.y = canvas.height - 30;
                        ball.dx = 4;
                        ball.dy = -4;
                    }
                }
            }

            collisionDetection();
            ball.x += ball.dx;
            ball.y += ball.dy;
            draw();
            requestAnimationFrame(move);
        }

        canvas.addEventListener('mousemove', (e) => {
            const relativeX = e.clientX - canvas.offsetLeft;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddle.x = relativeX - paddle.width / 2;
            }
        });

        function startGame() {
            if (gameRunning) return;
            paddle.x = 150;
            ball.x = 200;
            ball.y = 300;
            ball.dx = 4;
            ball.dy = -4;
            score = 0;
            lives = 3;
            scoreElement.textContent = score;
            livesElement.textContent = lives;
            initBricks();
            gameRunning = true;
            move();
        }

        initBricks();
        draw();
    </script>
</body>
</html>

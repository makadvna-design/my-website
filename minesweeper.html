<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper - GameZone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-bottom: 2px solid #ff0055;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #ff0055;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-back {
            padding: 10px 20px;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .game-container {
            margin-top: 100px;
            text-align: center;
        }
        h1 {
            font-size: 48px;
            color: #607d8b;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 40px);
            gap: 2px;
            margin: 0 auto;
            background: #555;
            padding: 5px;
            border-radius: 5px;
        }
        .cell {
            width: 40px;
            height: 40px;
            background: #777;
            border: none;
            border-radius: 3px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cell.revealed {
            background: #ccc;
            cursor: default;
        }
        .cell.mine {
            background: #e74c3c;
        }
        .btn-start {
            margin-top: 30px;
            padding: 15px 40px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="fas fa-gamepad"></i>
            GameZone
        </div>
        <a href="index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i>
            Баргаштан
        </a>
    </header>

    <div class="game-container">
        <h1>💣 Minesweeper</h1>
        <div class="grid" id="grid"></div>
        <button class="btn-start" onclick="initGame()">
            <i class="fas fa-redo"></i>
            Аз нав
        </button>
    </div>

    <script>
        const gridElement = document.getElementById('grid');
        const size = 10;
        const mineCount = 15;
        let grid = [];
        let gameOver = false;

        function initGrid() {
            grid = Array(size).fill(null).map(() => Array(size).fill({mine: false, revealed: false, count: 0}));
        }

        function placeMines() {
            let placed = 0;
            while (placed < mineCount) {
                const r = Math.floor(Math.random() * size);
                const c = Math.floor(Math.random() * size);
                if (!grid[r][c].mine) {
                    grid[r][c] = {...grid[r][c], mine: true};
                    placed++;
                }
            }
        }

        function calculateCounts() {
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (!grid[r][c].mine) {
                        let count = 0;
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                const nr = r + dr, nc = c + dc;
                                if (nr >= 0 && nr < size && nc >= 0 && nc < size && grid[nr][nc].mine) {
                                    count++;
                                }
                            }
                        }
                        grid[r][c] = {...grid[r][c], count};
                    }
                }
            }
        }

        function draw() {
            gridElement.innerHTML = '';
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const cell = document.createElement('button');
                    cell.className = 'cell';
                    if (grid[r][c].revealed) {
                        cell.classList.add('revealed');
                        if (grid[r][c].mine) {
                            cell.classList.add('mine');
                            cell.textContent = '💣';
                        } else if (grid[r][c].count > 0) {
                            cell.textContent = grid[r][c].count;
                        }
                    }
                    cell.addEventListener('click', () => reveal(r, c));
                    gridElement.appendChild(cell);
                }
            }
        }

        function reveal(r, c) {
            if (gameOver || grid[r][c].revealed) return;
            
            grid[r][c] = {...grid[r][c], revealed: true};
            
            if (grid[r][c].mine) {
                gameOver = true;
                alert('Мина! Бозӣ тамом шуд!');
                for (let i = 0; i < size; i++) {
                    for (let j = 0; j < size; j++) {
                        grid[i][j] = {...grid[i][j], revealed: true};
                    }
                }
            } else if (grid[r][c].count === 0) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < size && nc >= 0 && nc < size) {
                            reveal(nr, nc);
                        }
                    }
                }
            }
            draw();
        }

        function initGame() {
            gameOver = false;
            initGrid();
            placeMines();
            calculateCounts();
            draw();
        }

        initGame();
    </script>
</body>
</html>

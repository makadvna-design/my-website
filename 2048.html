<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - GameZone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-bottom: 2px solid #ff0055;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #ff0055;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-back {
            padding: 10px 20px;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .game-container {
            margin-top: 100px;
            text-align: center;
        }
        h1 {
            font-size: 48px;
            color: #ff9800;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .stats {
            font-size: 24px;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            gap: 10px;
            margin: 0 auto;
            background: #bbada0;
            padding: 10px;
            border-radius: 10px;
        }
        .cell {
            width: 100px;
            height: 100px;
            background: #cdc1b4;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
        }
        .cell[data-value="2"] { background: #eee4da; }
        .cell[data-value="4"] { background: #ede0c8; }
        .cell[data-value="8"] { background: #f2b179; color: #fff; }
        .cell[data-value="16"] { background: #f59563; color: #fff; }
        .cell[data-value="32"] { background: #f67c5f; color: #fff; }
        .cell[data-value="64"] { background: #f65e3b; color: #fff; }
        .cell[data-value="128"] { background: #edcf72; color: #fff; }
        .cell[data-value="256"] { background: #edcc61; color: #fff; }
        .cell[data-value="512"] { background: #edc850; color: #fff; }
        .cell[data-value="1024"] { background: #edc53f; color: #fff; }
        .cell[data-value="2048"] { background: #edc22e; color: #fff; }
        .btn-start {
            margin-top: 30px;
            padding: 15px 40px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }
        .instructions {
            margin-top: 20px;
            color: #999;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="fas fa-gamepad"></i>
            GameZone
        </div>
        <a href="index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i>
            Баргаштан
        </a>
    </header>

    <div class="game-container">
        <h1>🔢 2048</h1>
        <div class="stats">
            Хол: <span id="score">0</span>
        </div>
        <div class="grid" id="grid"></div>
        <button class="btn-start" onclick="initGame()">
            <i class="fas fa-redo"></i>
            Аз нав
        </button>
        <p class="instructions">Тугмаҳои стрелкаро истифода баред</p>
    </div>

    <script>
        const gridElement = document.getElementById('grid');
        const scoreElement = document.getElementById('score');
        let grid = [];
        let score = 0;

        function initGrid() {
            grid = Array(4).fill(null).map(() => Array(4).fill(0));
        }

        function addRandomTile() {
            const empty = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) empty.push({r, c});
                }
            }
            if (empty.length > 0) {
                const {r, c} = empty[Math.floor(Math.random() * empty.length)];
                grid[r][c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function draw() {
            gridElement.innerHTML = '';
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (grid[r][c] > 0) {
                        cell.textContent = grid[r][c];
                        cell.dataset.value = grid[r][c];
                    }
                    gridElement.appendChild(cell);
                }
            }
            scoreElement.textContent = score;
        }

        function slide(row) {
            let arr = row.filter(val => val);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr.splice(i + 1, 1);
                }
            }
            while (arr.length < 4) arr.push(0);
            return arr;
        }

        function moveLeft() {
            for (let r = 0; r < 4; r++) {
                grid[r] = slide(grid[r]);
            }
        }

        function moveRight() {
            for (let r = 0; r < 4; r++) {
                grid[r] = slide(grid[r].reverse()).reverse();
            }
        }

        function moveUp() {
            for (let c = 0; c < 4; c++) {
                let column = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
                column = slide(column);
                for (let r = 0; r < 4; r++) grid[r][c] = column[r];
            }
        }

        function moveDown() {
            for (let c = 0; c < 4; c++) {
                let column = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
                column = slide(column.reverse()).reverse();
                for (let r = 0; r < 4; r++) grid[r][c] = column[r];
            }
        }

        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowLeft': moveLeft(); addRandomTile(); break;
                case 'ArrowRight': moveRight(); addRandomTile(); break;
                case 'ArrowUp': moveUp(); addRandomTile(); break;
                case 'ArrowDown': moveDown(); addRandomTile(); break;
            }
            draw();
        });

        function initGame() {
            initGrid();
            score = 0;
            addRandomTile();
            addRandomTile();
            draw();
        }

        initGame();
    </script>
</body>
</html>

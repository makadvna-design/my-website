<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkers - GameZone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-bottom: 2px solid #ff0055;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #ff0055;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-back {
            padding: 10px 20px;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .game-container {
            margin-top: 100px;
            text-align: center;
        }
        h1 {
            font-size: 48px;
            color: #795548;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            margin: 0 auto;
            border: 5px solid #795548;
        }
        .square {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .white { background: #f0d9b5; }
        .black { background: #b58863; }
        .piece {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 3px solid #333;
        }
        .piece.red { background: #e74c3c; }
        .piece.black { background: #2c3e50; }
        .btn-start {
            margin-top: 30px;
            padding: 15px 40px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <i class="fas fa-gamepad"></i>
            GameZone
        </div>
        <a href="index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i>
            Баргаштан
        </a>
    </header>

    <div class="game-container">
        <h1>⚫ Checkers</h1>
        <div class="board" id="board"></div>
        <button class="btn-start" onclick="initGame()">
            <i class="fas fa-redo"></i>
            Аз нав
        </button>
    </div>

    <script>
        const boardElement = document.getElementById('board');
        let board = [];
        let selected = null;
        let turn = 'red';

        function initBoard() {
            board = Array(8).fill(null).map(() => Array(8).fill(null));
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) {
                        if (r < 3) board[r][c] = 'black';
                        if (r > 4) board[r][c] = 'red';
                    }
                }
            }
        }

        function draw() {
            boardElement.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    square.className = `square ${(r + c) % 2 === 0 ? 'white' : 'black'}`;
                    if (board[r][c]) {
                        const piece = document.createElement('div');
                        piece.className = `piece ${board[r][c]}`;
                        square.appendChild(piece);
                    }
                    square.addEventListener('click', () => handleClick(r, c));
                    boardElement.appendChild(square);
                }
            }
        }

        function handleClick(r, c) {
            if (!selected) {
                if (board[r][c] === turn) {
                    selected = {r, c};
                    draw();
                }
            } else {
                if ((r + c) % 2 === 1 && !board[r][c]) {
                    board[r][c] = board[selected.r][selected.c];
                    board[selected.r][selected.c] = null;
                    selected = null;
                    turn = turn === 'red' ? 'black' : 'red';
                    draw();
                }
            }
        }

        function initGame() {
            initBoard();
            selected = null;
            turn = 'red';
            draw();
        }

        initGame();
    </script>
</body>
</html>
